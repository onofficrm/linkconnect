name: Deploy to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: linkconnect-ftp-deploy
  # 연속 push 시 중간 배포 취소로 정적파일(사진·파비콘)이 빠지지 않게 대기
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: builder/linkconnect_source/package-lock.json

      - name: Build WordPress lead plugin zip
        run: |
          chmod +x scripts/build-wp-lead-plugin.sh
          ./scripts/build-wp-lead-plugin.sh
          test -f plugin/linkconnect/assets/wordpress/linkconnect-lead.zip

      - name: Build LinkConnect SPA
        run: |
          cd builder/linkconnect_source
          npm ci
          npm run deploy:imports
          test -f ../../plugin/onoff-builder-bridge/imports/linkconnect/index.html
          echo "Bundle: $(grep -o 'index-[A-Za-z0-9]*\.js' ../../plugin/onoff-builder-bridge/imports/linkconnect/index.html)"

      - name: Build banktupt merchant landing
        run: |
          cd merchant/bunkrupt
          npm ci
          npm run deploy:imports
          test -f ../../plugin/onoff-builder-bridge/imports/banktupt/index.html
          echo "Banktupt bundle: $(grep -o 'index-[A-Za-z0-9]*\.js' ../../plugin/onoff-builder-bridge/imports/banktupt/index.html)"

      - name: Build dasibom merchant landing
        run: |
          cd merchant/bankrupt_dasibom
          npm ci
          npm run deploy:imports
          test -f ../../plugin/onoff-builder-bridge/imports/dasibom/index.html
          echo "Dasibom bundle: $(grep -o 'index-[A-Za-z0-9]*\.js' ../../plugin/onoff-builder-bridge/imports/dasibom/index.html)"

      - name: Build hasugu_cpa merchant landing
        run: |
          cd merchant/hasugu_cpa
          npm ci
          npm run deploy:imports
          test -f ../../plugin/onoff-builder-bridge/imports/hasugu_cpa/index.html
          echo "Hasugu CPA bundle: $(grep -o 'index-[A-Za-z0-9]*\.js' ../../plugin/onoff-builder-bridge/imports/hasugu_cpa/index.html)"

      - name: Build modemo merchant landing
        run: |
          cd merchant/modemo-onepage
          npm ci
          npm run deploy:imports
          test -f ../../plugin/onoff-builder-bridge/imports/modemo/index.html
          echo "Modemo bundle ready: $(test -f ../../plugin/onoff-builder-bridge/imports/modemo/index.html && echo OK)"

      - name: Clean junk files before upload
        run: |
          find plugin/onoff-builder-bridge/imports/linkconnect -name '._*' -delete 2>/dev/null || true
          find plugin/onoff-builder-bridge/imports/linkconnect -name '.DS_Store' -delete 2>/dev/null || true
          find plugin/onoff-builder-bridge/imports/banktupt -name '._*' -delete 2>/dev/null || true
          find plugin/onoff-builder-bridge/imports/banktupt -name '.DS_Store' -delete 2>/dev/null || true
          find plugin/onoff-builder-bridge/imports/dasibom -name '._*' -delete 2>/dev/null || true
          find plugin/onoff-builder-bridge/imports/dasibom -name '.DS_Store' -delete 2>/dev/null || true
          find plugin/onoff-builder-bridge/imports/hasugu_cpa -name '._*' -delete 2>/dev/null || true
          find plugin/onoff-builder-bridge/imports/hasugu_cpa -name '.DS_Store' -delete 2>/dev/null || true
          find plugin/onoff-builder-bridge/imports/modemo -name '._*' -delete 2>/dev/null || true
          find plugin/onoff-builder-bridge/imports/modemo -name '.DS_Store' -delete 2>/dev/null || true
          rm -rf builder/linkconnect_source/node_modules merchant/bunkrupt/node_modules merchant/bankrupt_dasibom/node_modules merchant/hasugu_cpa/node_modules merchant/modemo-onepage/node_modules

      - name: Prepare deploy bundle (app code + SPA core)
        run: |
          rm -rf .deploy/bundle
          ROOT=".deploy/bundle"
          SRC="plugin/onoff-builder-bridge/imports/linkconnect"
          mkdir -p "$ROOT"/{css,extend,skin/member,mobile/skin/member,about,affiliate,notice,community,inquiry,advertiser-apply,terms,privacy,inc,merchant/banktupt,merchant/dasibom,merchant/hasugu_cpa,merchant/modemo,cron,go/lp,r,c,s,api/external/linkprice,plugin/onoff-builder-bridge/imports/linkconnect,plugin/onoff-builder-bridge/imports/banktupt,plugin/onoff-builder-bridge/imports/dasibom,plugin/onoff-builder-bridge/imports/hasugu_cpa,plugin/onoff-builder-bridge/imports/modemo,plugin/linkconnect/inc,plugin/linkconnect/layout,plugin/linkconnect/assets/css,plugin/linkconnect/assets/js,plugin/linkconnect/assets/wordpress,plugin/linkconnect/assets/contracts/custom,plugin/linkconnect/api,plugin/linkconnect/api/v1/merchant,plugin/linkconnect/admin/api,plugin/linkconnect/cron,plugin/linkconnect/install,plugin/linkconnect/partner/api}
          cp css/onoff-platform.css "$ROOT/css/"
          cp extend/linkconnect-member.extend.php extend/linkconnect-spa.extend.php "$ROOT/extend/"
          cp -R skin/_inc "$ROOT/skin/"
          cp -R skin/member/onoff "$ROOT/skin/member/"
          cp -R mobile/skin/member/onoff "$ROOT/mobile/skin/member/"
          cp favicon.png .htaccess "$ROOT/"
          # air911 등 독립도메인 브라우저 기본 /favicon.ico 요청용
          if [[ -f plugin/onoff-builder-bridge/imports/dasibom/favicon.ico ]]; then
            cp plugin/onoff-builder-bridge/imports/dasibom/favicon.ico "$ROOT/favicon.ico"
          fi
          if [[ -f plugin/onoff-builder-bridge/imports/dasibom/apple-touch-icon.png ]]; then
            cp plugin/onoff-builder-bridge/imports/dasibom/apple-touch-icon.png "$ROOT/apple-touch-icon.png"
          fi
          if [[ -f plugin/onoff-builder-bridge/imports/dasibom/favicon.svg ]]; then
            cp plugin/onoff-builder-bridge/imports/dasibom/favicon.svg "$ROOT/favicon.svg"
          fi
          if [[ -f plugin/onoff-builder-bridge/imports/dasibom/favicon-32x32.png ]]; then
            cp plugin/onoff-builder-bridge/imports/dasibom/favicon-32x32.png "$ROOT/favicon-32x32.png"
          fi
          if [[ -f plugin/onoff-builder-bridge/imports/dasibom/lawyer-portrait.jpg ]]; then
            cp plugin/onoff-builder-bridge/imports/dasibom/lawyer-portrait.jpg "$ROOT/lawyer-portrait.jpg"
          elif [[ -f merchant/bankrupt_dasibom/public/lawyer-portrait.jpg ]]; then
            cp merchant/bankrupt_dasibom/public/lawyer-portrait.jpg "$ROOT/lawyer-portrait.jpg"
          fi
          cp merchant/banktupt/index.php "$ROOT/merchant/banktupt/"
          cp merchant/dasibom/index.php "$ROOT/merchant/dasibom/"
          cp merchant/hasugu_cpa/index.php "$ROOT/merchant/hasugu_cpa/"
          cp merchant/modemo/index.php "$ROOT/merchant/modemo/"
          cp head.php tail.php "$ROOT/"
          cp -R about affiliate notice community inquiry advertiser-apply terms privacy "$ROOT/"
          # 센터 SPA 스텁 — FTP sync 시 누락되면 /partner /advertiser /admin 접속이 깨짐
          mkdir -p "$ROOT"/{partner,advertiser,admin}
          cp -R partner/. "$ROOT/partner/"
          cp -R advertiser/. "$ROOT/advertiser/"
          cp -R admin/. "$ROOT/admin/"
          cp inc/linkconnect-spa-bootstrap.php "$ROOT/inc/"
          cp -R plugin/onoff-builder-bridge/lib plugin/onoff-builder-bridge/data "$ROOT/plugin/onoff-builder-bridge/"
          cp plugin/linkconnect/config.php "$ROOT/plugin/linkconnect/"
          mkdir -p "$ROOT/plugin/linkconnect/api" "$ROOT/plugin/linkconnect/install" "$ROOT/plugin/linkconnect/partner/api" "$ROOT/plugin/linkconnect/merchant/api" "$ROOT/plugin/linkconnect/admin/api" "$ROOT/plugin/linkconnect/cron"
          cp plugin/linkconnect/inc/db.php plugin/linkconnect/inc/settings.php plugin/linkconnect/inc/ui.php plugin/linkconnect/inc/landing.php plugin/linkconnect/inc/call.php plugin/linkconnect/inc/link.php plugin/linkconnect/inc/partner_analytics.php plugin/linkconnect/inc/campaign.php plugin/linkconnect/inc/campaign_thumbnail.php plugin/linkconnect/inc/campaign_banktupt.php plugin/linkconnect/inc/campaign_dasibom.php plugin/linkconnect/inc/campaign_hasugu_cpa.php plugin/linkconnect/inc/campaign_modemo.php plugin/linkconnect/inc/campaign_promo_guide.php plugin/linkconnect/inc/image_process.php plugin/linkconnect/inc/partner.php plugin/linkconnect/inc/merchant.php plugin/linkconnect/inc/merchant_contract_config.php plugin/linkconnect/inc/merchant_contract.php plugin/linkconnect/inc/merchant_contract_body.php plugin/linkconnect/inc/merchant_contract_pdf.php plugin/linkconnect/inc/merchant_contract_access.php plugin/linkconnect/inc/merchant_contract_read.php plugin/linkconnect/inc/merchant_contract_admin.php plugin/linkconnect/inc/merchant_contract_addendum.php plugin/linkconnect/inc/merchant_contract_custom.php plugin/linkconnect/inc/merchant_ad_apply.php plugin/linkconnect/inc/merchant_marketing.php plugin/linkconnect/inc/call_recording_request.php plugin/linkconnect/inc/admin.php plugin/linkconnect/inc/demo_seed.php plugin/linkconnect/inc/gemini.php plugin/linkconnect/inc/openai.php plugin/linkconnect/inc/ai.php plugin/linkconnect/inc/auth_bootstrap.php plugin/linkconnect/inc/conversion.php plugin/linkconnect/inc/wallet.php plugin/linkconnect/inc/api.php plugin/linkconnect/inc/api_client.php plugin/linkconnect/inc/abuse.php plugin/linkconnect/inc/linkprice.php plugin/linkconnect/inc/notice_board.php plugin/linkconnect/inc/community_board.php plugin/linkconnect/inc/inquiry.php plugin/linkconnect/inc/notification.php plugin/linkconnect/inc/settlement.php plugin/linkconnect/inc/email_notify.php "$ROOT/plugin/linkconnect/inc/"
          cp plugin/linkconnect/api/receive.php plugin/linkconnect/api/landing_context.php plugin/linkconnect/api/call_receive.php plugin/linkconnect/api/call-recording-file.php plugin/linkconnect/api/campaigns.php plugin/linkconnect/api/lp_postback.php plugin/linkconnect/api/lp_health.php plugin/linkconnect/api/campaign-thumbnail.php plugin/linkconnect/api/notice.php plugin/linkconnect/api/community.php plugin/linkconnect/api/inquiry.php plugin/linkconnect/api/tracking_probe.php "$ROOT/plugin/linkconnect/api/"
          if [[ -d plugin/linkconnect/api ]]; then
            cp plugin/linkconnect/api/*.php "$ROOT/plugin/linkconnect/api/" 2>/dev/null || true
          fi
          if [[ -d plugin/linkconnect/api/v1/merchant ]]; then
            mkdir -p "$ROOT/plugin/linkconnect/api/v1/merchant"
            cp plugin/linkconnect/api/v1/merchant/*.php "$ROOT/plugin/linkconnect/api/v1/merchant/" 2>/dev/null || true
          fi
          cp plugin/linkconnect/partner/api/apply.php plugin/linkconnect/partner/api/linkprice.php plugin/linkconnect/partner/api/_common.php "$ROOT/plugin/linkconnect/partner/api/"
          if [[ -d plugin/linkconnect/partner/api ]]; then
            cp plugin/linkconnect/partner/api/*.php "$ROOT/plugin/linkconnect/partner/api/" 2>/dev/null || true
          fi
          cp plugin/linkconnect/merchant/api/apply.php "$ROOT/plugin/linkconnect/merchant/api/"
          cp plugin/linkconnect/merchant/contract-document.php plugin/linkconnect/merchant/contract-download.php plugin/linkconnect/merchant/contract-signature.php "$ROOT/plugin/linkconnect/merchant/"
          bash plugin/linkconnect/install/install_tcpdf.sh
          if [[ -d plugin/linkconnect/lib/tcpdf ]]; then
            mkdir -p "$ROOT/plugin/linkconnect/lib"
            cp -R plugin/linkconnect/lib/tcpdf "$ROOT/plugin/linkconnect/lib/"
          fi
          mkdir -p "$ROOT/plugin/linkconnect/data/contract_signatures" "$ROOT/plugin/linkconnect/data/campaign_promo_assets" "$ROOT/plugin/linkconnect/data/campaign_thumbnails" "$ROOT/plugin/linkconnect/data/ad_applications"
          cp plugin/linkconnect/data/contract_signatures/.htaccess "$ROOT/plugin/linkconnect/data/contract_signatures/" 2>/dev/null || true
          cp plugin/linkconnect/data/campaign_promo_assets/.htaccess "$ROOT/plugin/linkconnect/data/campaign_promo_assets/" 2>/dev/null || true
          cp plugin/linkconnect/data/campaign_thumbnails/.htaccess "$ROOT/plugin/linkconnect/data/campaign_thumbnails/" 2>/dev/null || true
          printf '%s\n' 'Require all denied' > "$ROOT/plugin/linkconnect/data/ad_applications/.htaccess"
          if [[ -d plugin/linkconnect/merchant/api ]]; then
            cp plugin/linkconnect/merchant/api/*.php "$ROOT/plugin/linkconnect/merchant/api/" 2>/dev/null || true
          fi
          cp plugin/linkconnect/admin/api/_common.php plugin/linkconnect/admin/api/linkprice.php "$ROOT/plugin/linkconnect/admin/api/"
          if [[ -d plugin/linkconnect/admin/api ]]; then
            cp plugin/linkconnect/admin/api/*.php "$ROOT/plugin/linkconnect/admin/api/" 2>/dev/null || true
          fi
          cp plugin/linkconnect/admin/contract-document.php plugin/linkconnect/admin/contract-download.php plugin/linkconnect/admin/contract-signature.php "$ROOT/plugin/linkconnect/admin/" 2>/dev/null || true
          cp plugin/linkconnect/cron/linkprice_sync_merchants.php "$ROOT/plugin/linkconnect/cron/"
          cp cron/linkprice_sync_merchants.php "$ROOT/cron/"
          cp plugin/linkconnect/cron/linkprice_sync_conversions.php "$ROOT/plugin/linkconnect/cron/"
          cp cron/linkprice_sync_conversions.php "$ROOT/cron/"
          cp go/lp/index.php "$ROOT/go/lp/"
          cp r/index.php "$ROOT/r/"
          cp c/index.php "$ROOT/c/"
          cp s/index.php "$ROOT/s/"
          cp api/external/linkprice/postback.php "$ROOT/api/external/linkprice/"
          cp plugin/linkconnect/_common.php "$ROOT/plugin/linkconnect/"
          cp plugin/linkconnect/install/apply_banktupt_campaign.php plugin/linkconnect/install/apply_hasugu_cpa_campaign.php plugin/linkconnect/install/apply_modemo_campaign.php plugin/linkconnect/install/apply_yevely_modemo_domain.php plugin/linkconnect/install/apply_skawning_hasugu_domain.php plugin/linkconnect/install/inspect_promo_guide.php plugin/linkconnect/install/apply_adv0008_contract.php plugin/linkconnect/install/linkprice_cps_schema.sql plugin/linkconnect/install/merchant_contract_schema.sql plugin/linkconnect/install/test_email_notify.php "$ROOT/plugin/linkconnect/install/"
          cp plugin/linkconnect/layout/header.php "$ROOT/plugin/linkconnect/layout/"
          cp plugin/linkconnect/assets/css/linkconnect.css "$ROOT/plugin/linkconnect/assets/css/"
          cp plugin/linkconnect/assets/js/linkconnect.js plugin/linkconnect/assets/js/lead-embed.js "$ROOT/plugin/linkconnect/assets/js/"
          cp plugin/linkconnect/assets/wordpress/linkconnect-lead.zip "$ROOT/plugin/linkconnect/assets/wordpress/"
          cp plugin/linkconnect/inc/embed.php "$ROOT/plugin/linkconnect/inc/"
          if [[ -d plugin/linkconnect/assets/contracts/custom ]]; then
            mkdir -p "$ROOT/plugin/linkconnect/assets/contracts/custom"
            cp plugin/linkconnect/assets/contracts/custom/* "$ROOT/plugin/linkconnect/assets/contracts/custom/" 2>/dev/null || true
          fi
          cp "$SRC/index.html" "$SRC/favicon.png" "$SRC/favicon-32.png" "$SRC/apple-touch-icon.png" "$SRC/hero_dashboard_mockup.webp" "$ROOT/plugin/onoff-builder-bridge/imports/linkconnect/"
          cp -R "$SRC/assets" "$ROOT/plugin/onoff-builder-bridge/imports/linkconnect/"
          if [[ -d plugin/onoff-builder-bridge/imports/banktupt ]]; then
            cp plugin/onoff-builder-bridge/imports/banktupt/index.html "$ROOT/plugin/onoff-builder-bridge/imports/banktupt/"
            cp -R plugin/onoff-builder-bridge/imports/banktupt/assets "$ROOT/plugin/onoff-builder-bridge/imports/banktupt/"
          fi
          if [[ -d plugin/onoff-builder-bridge/imports/dasibom ]]; then
            # index.html + assets + public root files (favicon, portrait, og-image, manifest)
            rsync -a --delete \
              --exclude '._*' \
              --exclude '.DS_Store' \
              plugin/onoff-builder-bridge/imports/dasibom/ \
              "$ROOT/plugin/onoff-builder-bridge/imports/dasibom/"
          fi
          if [[ -d plugin/onoff-builder-bridge/imports/hasugu_cpa ]]; then
            # index.html + assets + public root images (hero, pipe photos)
            rsync -a --delete \
              --exclude '._*' \
              --exclude '.DS_Store' \
              plugin/onoff-builder-bridge/imports/hasugu_cpa/ \
              "$ROOT/plugin/onoff-builder-bridge/imports/hasugu_cpa/"
          fi
          if [[ -d plugin/onoff-builder-bridge/imports/modemo ]]; then
            rsync -a --delete \
              --exclude '._*' \
              --exclude '.DS_Store' \
              plugin/onoff-builder-bridge/imports/modemo/ \
              "$ROOT/plugin/onoff-builder-bridge/imports/modemo/"
          fi
          find "$ROOT" -name '._*' -delete 2>/dev/null || true
          echo "Bundle: $(find "$ROOT" -type f | wc -l) files, $(du -sh "$ROOT" | cut -f1)"

      - name: Deploy app + SPA core (single FTP session)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          parallel: 1
          protocol: ftp
          local-dir: .deploy/bundle/
          server-dir: /public_html/
          state-name: linkconnect-deploy-v4
          log-level: minimal
          timeout: 600000

      - name: Wait between FTP sessions
        run: sleep 30

      - name: Deploy SPA static images (about · webtoon)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        continue-on-error: true
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          parallel: 1
          protocol: ftp
          local-dir: plugin/onoff-builder-bridge/imports/linkconnect/
          server-dir: /public_html/plugin/onoff-builder-bridge/imports/linkconnect/
          state-name: linkconnect-spa-media-v2
          log-level: minimal
          timeout: 600000
          exclude: |
            index.html
            favicon.png
            favicon-32.png
            apple-touch-icon.png
            hero_dashboard_mockup.webp
            assets/**
